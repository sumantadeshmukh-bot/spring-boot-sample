spring.application.name=spring-boot-sample

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:sampledb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Agentic AI layer (see docs/agentic-concepts/agentic-application-layer.md)
# "mock" (default) needs no API key and makes no network calls - safe for tests/CI.
# Set to "anthropic" + ANTHROPIC_API_KEY env var to use the real model.
app.ai.provider=mock
# app.ai.anthropic.model=claude-sonnet-4-5-20250929
# app.ai.anthropic.max-tokens=1024
